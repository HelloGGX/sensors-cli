name: Publish to PyPI

# 在 push 形如 v0.1.0 的 tag 时触发发布
on:
  push:
    tags:
      - "v*"

# Trusted Publishers (OIDC) 必需:允许 PyPI 验证本次 workflow 来源
permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 关闭 sigstore attestations:rekor 透明日志服务偶有 502 故障,
          # 且对内部工具非必需。如需供应链签名证明,改为 true 即可。
          attestations: false
