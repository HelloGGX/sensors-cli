name: Dependency Freshness Report

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Git commit SHA to analyze, full 40-character SHA (omit for the default ref at workflow run time)
        required: false
        type: string

jobs:
  dep-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit != '' && inputs.commit || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run dependency freshness check
        id: freshness
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          report_dir="docs/reports/dependency-freshness"
          report_path="${report_dir}/$(date -u +%F)_dep-freshness_${short_sha}.md"
          raw_path="${report_dir}/$(date -u +%F)_dep-freshness_${short_sha}.txt"

          mkdir -p "${report_dir}"

          echo "short=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "report_path=${report_path}" >> "$GITHUB_OUTPUT"
          echo "raw_path=${raw_path}" >> "$GITHUB_OUTPUT"

          {
            echo "Analyzed git commit: $(git rev-parse HEAD)"
            echo ""
            uv run python .sensors/security/fresh.py 2>&1 | sed 's/\x1b\[[0-9;]*m//g'
          } | tee "${raw_path}" || true

      - name: Analyse results with Claude and write report
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools Read,Write,WebFetch,WebSearch,Bash --max-turns 20"
          prompt: |
            Read the file `${{ steps.freshness.outputs.raw_path }}`.

            Based on that information, do an analysis and create recommendations.
            Be sure to do research both in the codebase and if necessary get more 
            information from PyPI or the internet, before you make any recommendations.

            For each recommendation, consider creating a GH issue to track it.
            Finally, write a markdown report to `${{ steps.freshness.outputs.report_path }}`.

            _____GH ISSUES_____

            !! This will only work if GH Issues are activated for this repository. As soon as it turns out they are not, just skip this step and mention at the end of your report that you couldn't create any issues because of that.

            Manage GitHub issues for actionable findings using the `gh` CLI.

            1. Ensure the tracking label exists (safe to re-run):
               gh label create dep-freshness --color "e4e669" --description "Dependency freshness follow-up" --force

            2. Fetch existing open issues with this label so you can avoid duplicates:
               gh issue list --label dep-freshness --state open --json number,title

            3. For each package whose recommendation is Remove, Replace, or Inline:
               - Check whether an open issue already exists whose title contains the package name.
               - If NO existing issue: create one with:
                 gh issue create \
                   --title "[dep-freshness] <package-name>: <Recommendation>" \
                   --label dep-freshness \
                   --body "<body>"
               - If an issue already exists: skip -- do not create a duplicate.

               The issue body should include:
               - What the package is used for in this project
               - Why it is flagged (issues from the check output)
               - The concrete recommendation with reasoning
               - Any relevant links (PyPI page, alternative package, etc.)

            Only create issues for Remove / Replace / Inline recommendations. Do not create issues for Keep / Monitor.

            _____REPORT_____

            Be concise and actionable.
            When your recommendation is based on a web link or further research on the package in the registry, add that source.

            # Dependency Freshness Report

            Brief one-paragraph summary of overall health.

            ## Flagged packages

            For each flagged package (errors first, then warnings), create a section:

            ### `<package-name>`
            - **Status**: error / warning
            - **Issues**: list of issues from the check output
            - **Used for**: short description of what it does in this project (not just what it does in general, but what you found it does in THIS project)
            - **Recommendation**: one of:
              - Remove — if the package does not appear to be genuinely used in this codebase
              - Replace — suggest a more current alternative (name it if you know one)
              - Inline — if the functionality is small enough to reimplement
              - Keep / Monitor — if it is widely used, actively maintained upstream despite the flag, or the risk is low

            ## Summary table

            | Package | Issues | Recommendation | Issue                                                                                   |
            |---------|--------|----------------|-----------------------------------------------------------------------------------------|
            | ...     | ...    | ...            | Created: [number](issue-url) / Already exists: [number](issue-url) / None (and why not) |

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dep-freshness-report-${{ github.run_id }}-${{ steps.freshness.outputs.short }}
          path: |
            ${{ steps.freshness.outputs.report_path }}
            ${{ steps.freshness.outputs.raw_path }}

      - name: Commit freshness report
        if: ${{ inputs.commit == '' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.freshness.outputs.report_path }}" "${{ steps.freshness.outputs.raw_path }}"

          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi

          git commit -m "chore(dep-freshness): add report for $(git rev-parse --short HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish report to job summary
        run: cat "${{ steps.freshness.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"

      
