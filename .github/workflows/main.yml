name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".sensors/sensors-cli.sensors.yaml"
      - ".claude/**"
      - ".vscode/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Update lockfile
        run: uv lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest tests/ -v

      - name: Coverage
        run: uv run pytest tests/ --cov=sensors --cov-report=term-missing

      - name: Ruff
        run: python ./.sensors/maintainability/ruff_guidance.py -- check sensors/

      - name: Ruff security
        run: python ./.sensors/maintainability/ruff_guidance.py -- --select S check sensors/

      - name: Import linting
        run: uv run lint-imports

      - name: Custom checks
        run: uv run python ./.sensors/maintainability/custom_checks.py --output-format json
