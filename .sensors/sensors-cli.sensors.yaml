version: 1
prompt: "If sensors report issues you didn't introduce, fix them anyway unless the fix is risky or large. Do not skip pre-existing issues."

runners:

  - name: tests
    parser: pytest
    enabled: true
    mode: interval
    command: uv run pytest tests/ -v
    interval: 10000

  - name: cov
    parser: pytest_cov
    enabled: true
    mode: interval
    command: uv run pytest tests/ --cov=sensors --cov-report=term-missing
    interval: 10000

  - name: ruff
    parser: default
    enabled: true
    mode: interval
    command: python ./.sensors/maintainability/ruff_guidance.py -- check sensors/
    interval: 10000

  - name: ruff-sec
    parser: default
    enabled: true
    mode: interval
    command: python ./.sensors/maintainability/ruff_guidance.py -- --select S check sensors/
    interval: 10000
  
  - name: imports
    parser: import_linter
    enabled: true
    mode: interval
    command: uv run lint-imports
    interval: 26000