version: 1
prompt: "Follow scouting rule: if sensors are reporting issues you didn't cause with a change, consider to leave the code better than you found it, if it's a small change."

runners:

  - name: tests
    parser: pytest
    enabled: true
    mode: interval
    command: uv run pytest tests/ -v
    interval: 10000

  - name: cov
    parser: pytest_cov
    enabled: true
    mode: interval
    command: uv run pytest tests/ --cov=sensors --cov-report=term-missing
    interval: 10000

  - name: ruff
    parser: ruff
    enabled: true
    mode: interval
    command: python ./.sensors/maintainability/ruff_guidance.py -- check sensors/
    interval: 10000

  - name: ruff-sec
    parser: ruff
    enabled: true
    mode: interval
    command: python ./.sensors/maintainability/ruff_guidance.py -- --select S check sensors/
    interval: 10000
